name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # 手元と同じ1つのコマンド（C-61、#74）：品質チェック（check）→ smoke のスクリプトの単体テスト（test:smoke。子プロセス・後始末の部品）
      # → 配布物の確認（pack:check。組み立て・パック・インストール・起動）。生成したプロジェクトを動かす smoke は手動（smoke.yml）
      - run: npm run check:all
