# GitHub Actions の無料枠がなくなったため、push・PR では動かさず、手動（Actions の画面の「Run workflow」）だけにする（利用者の判断）。
# 品質チェックは手元で npm run check・npm run pack:check を実行して確かめる。
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: 配布物の確認（組み立て・パック・インストール・起動）
        run: npm run pack:check
