# もとになった共通仕様：C-62・C-82
# 依存ライブラリの更新の通知と、更新の PR（Dependabot、C-82）。
# 更新の PR は、取り込む前に品質チェック（npm run check）を通し、C-62 の手順（バージョンを固定したまま、動作を確かめる）で確かめる。
# Semgrep・gitleaks・OSV-Scanner・Schemathesis の Docker イメージ（scripts/security-check.mjs・docs/testing/）は、Dependabot の対象外。手で更新する（docs/testing/security.md）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Vitest に関係する依存の定期更新をまとめる。残りは本番用と開発用に分ける。
      vitest-packages:
        applies-to: version-updates
        patterns:
          - vitest
          - "@cloudflare/vitest-pool-workers"
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
{{dependabot_vitest_ignore}}  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
