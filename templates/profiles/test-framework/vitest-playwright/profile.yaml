# 技術プロファイル：テストの道具（F-24）
id: vitest-playwright
category: test-framework
name: Vitest・Playwright ほか
languages: [typescript]
packages: [vitest, "@cloudflare/vitest-pool-workers", "@testing-library/react", "@testing-library/dom", "@testing-library/user-event", jsdom, msw, fast-check, "@playwright/test"]
# テストの道具は、すべて開発でだけ使う（生成する package.json の devDependencies に入れる）
dev_packages: [vitest, "@cloudflare/vitest-pool-workers", "@testing-library/react", "@testing-library/dom", "@testing-library/user-event", jsdom, msw, fast-check, "@playwright/test"]
# npm で入れない道具。バージョンの調査の対象にせず、手順書（docs/testing/）で導入する
external_tools: [k6]
# ひな形で動作を確かめたバージョン（2026-09-30、Issue #19 の試作で確認）
verified_versions:
  vitest: "4.1.11"
  "@cloudflare/vitest-pool-workers": "0.22.0"
  "@testing-library/react": "16.3.3"
  "@testing-library/dom": "10.4.2"
  "@testing-library/user-event": "14.6.7"   # 2026-10-03、Issue #33 の試作で確認
  jsdom: "30.1.1"
  msw: "3.0.1"
  fast-check: "4.10.2"
  "@playwright/test": "1.63.0"
# 組み合わせの条件のうち、版の範囲で表せるもの（文章の説明は compatibility_notes に残す）
version_ranges:
  vitest: "^4"   # @cloudflare/vitest-pool-workers が Vitest 4系にだけ対応する
compatibility_notes:
  - "@cloudflare/vitest-pool-workers は Vitest 4系にだけ対応する（5系は不可）"
  - "vitest-pool-workers の中では pg（PostgreSQLのドライバ）を読み込めない。Workers＋PostgreSQL は wrangler dev に対するAPIのテストで確かめる"
  - "msw はバージョンを明示する（指定しないと古い版が入ることがある）"
  - "jsdom の画面の場所と、テストで呼ぶAPIのドメインをそろえる（別のドメインだと通信の制限で失敗する）"
  - "k6 と OWASP ZAP は npm ではなく、手順書（docs/testing/）に沿って導入する"
skill_name: test-tools
files:
  files/playwright.config.ts: playwright.config.ts
  files/console-guard.ts: e2e/console-guard.ts
  files/health.spec.ts: e2e/health.spec.ts
  files/test-setup.ts: frontend/src/test/setup.ts
  files/test-server.ts: frontend/src/test/server.ts
# vitest.config.ts は DB の回答で変わる。D1 だけ、マイグレーションを読み込んでテスト用の D1 に適用する
files_when:
  - when: { answer: database, equals: d1 }
    files:
      files/vitest.d1.config.ts: vitest.config.ts
      files/apply-migrations.ts: backend/test/apply-migrations.ts
      files/sample-users.spec.ts: e2e/sample-users.spec.ts
      files/e2e-seed.sql: e2e/seeds/health.sql
  - when: { answer: database, equals: postgresql }
    files:
      files/vitest.pg.config.ts: vitest.config.ts
      files/sample-users.spec.ts: e2e/sample-users.spec.ts
      files/e2e-seed.sql: e2e/seeds/health.sql
  - when: { answer: database, equals: none }
    files:
      files/vitest.config.ts: vitest.config.ts
package_json:
  scripts:
    test: node scripts/run-local.ts test vitest run
    pretest: npm run env:check -- test && npm run types:test
    # E2E（C-24）。ブラウザが要るため npm run check には入れない（手順は docs/testing/e2e.md）。
    # 検証用 DB の初期化は、サーバーの起動前に走る pretest:e2e で行う（DB の有無で変わるため package_json_when に書く）
    test:e2e: node scripts/run-local.ts test playwright test
  # msw のインストール後の処理（ブラウザ用の部品の配置）は使わない（Node.js のテストだけで使うため）
  allowScripts:
    msw: false
package_json_when:
  - when: { answer: database, equals: none }
    package_json:
      scripts:
        pretest:e2e: "npm run env:check -- test"
  # DB ありは、検証用 DB を初期化（マイグレーションと標準のシード）してから、E2E 用のシードを足す
  - when: { answer: database, equals: d1 }
    package_json:
      scripts:
        pretest:e2e: "npm run env:check -- test && npm run db:reset:test && node scripts/db-local.ts test seed-file e2e/seeds/health.sql"
  - when: { answer: database, equals: postgresql }
    package_json:
      scripts:
        pretest:e2e: "npm run env:check -- test && npm run db:reset:test && node scripts/db-local.ts test seed-file e2e/seeds/health.sql"
