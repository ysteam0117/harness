# 技術プロファイル：Vite＋React Router（F-24）
id: vite-react-router
category: frontend-build
name: Vite＋React Router
languages: [typescript]
packages: [vite, "@vitejs/plugin-react", "@cloudflare/vite-plugin", react, react-dom, react-router, "@types/react", "@types/react-dom"]
# ビルドの道具と型（生成する package.json の devDependencies に入れる）。残りは dependencies に入れる
dev_packages: [vite, "@vitejs/plugin-react", "@cloudflare/vite-plugin", "@types/react", "@types/react-dom"]
# ひな形で動作を確かめたバージョン（2026-09-30、Issue #19 の試作で確認）
verified_versions:
  vite: "8.3.1"
  "@vitejs/plugin-react": "6.1.1"
  "@cloudflare/vite-plugin": "1.62.2"
  react: "19.3.0"
  react-dom: "19.3.0"
  react-router: "8.4.0"
  "@types/react": "19.3.0"       # 2026-10-03、Issue #56 で react 19.3.0 との組み合わせを確認
  "@types/react-dom": "19.3.0"   # 同上（@types/react ^19.3.0 を求める）
compatibility_notes:
  - "@cloudflare/vite-plugin で、画面とAPI（Hono）を1つのWorkersにまとめ、同じドメインから配信する"
  - "wrangler.jsonc の assets に run_worker_first（/api/*）と not_found_handling（single-page-application）を設定する"
  - "Viteの起点（root）とローカルのD1の保存先をそろえる。マイグレーションの適用時は --persist-to で同じ保存先を指定する"
  - "2026-09-30 の確認で、初回に読み込むJavaScriptは圧縮後161KB（React・React Router・TanStack Query・React Hook Form・Zod・Axios）"
skill_name: frontend-build
files:
  files/vite.config.ts: vite.config.ts
  files/index.html: index.html
  files/_headers: public/_headers
  files/main.tsx: frontend/src/main.tsx
  files/HomePage.tsx: frontend/src/pages/HomePage.tsx
  files/health-api.ts: frontend/src/features/health/api/health.ts
  files/HealthStatus.tsx: frontend/src/features/health/HealthStatus.tsx
  files/HealthStatus.test.tsx: frontend/src/features/health/HealthStatus.test.tsx
# 認証なし・未定のときだけ出す App.tsx（認証ありのときは、auth/session の App.tsx を同じ出力先に出す）
files_when:
  - when: { answer: auth, in: [none, undecided] }
    files:
      files/App.tsx: frontend/src/App.tsx
# wrangler.jsonc に足す設定。ハーネスが、選んだプロファイルの設定をまとめて JSON にする（値の {{名前}} はまとめた後に差し込む）
wrangler:
  name: "{{app_name}}"
  main: backend/src/index.ts
  # テストの道具（@cloudflare/vitest-pool-workers）が対応する日付以下にする
  compatibility_date: "{{compatibility_date}}"
  assets:
    not_found_handling: single-page-application
    run_worker_first: ["/api/*"]
  vars:
    APP_ENV: production
    # 状態を変える要求を許可する送信元（環境ごとに設定する）
    ALLOWED_ORIGINS: "{{allowed_origins}}"
package_json:
  scripts:
    dev: node scripts/run-local.ts development vite
    dev:test: node scripts/run-local.ts test vite
    build: node scripts/run-local.ts build vite build
    preview: node scripts/run-local.ts development vite preview
    types: node scripts/run-local.ts development wrangler types
    types:test: node scripts/run-local.ts test wrangler types
    predev: npm run env:check -- development && npm run types
    predev:test: npm run env:check -- test && npm run types:test
    docker:up:local: node scripts/compose-local.ts development up -d
    docker:up:test: node scripts/compose-local.ts test up -d
    docker:down:local: node scripts/compose-local.ts development down
    docker:down:test: node scripts/compose-local.ts test down
