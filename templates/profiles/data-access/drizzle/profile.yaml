# 技術プロファイル：Drizzle ORM（F-24）
id: drizzle
category: data-access
name: Drizzle ORM
languages: [typescript]
databases: [cloudflare-d1, postgresql]
# CLIが最新の安定版を調べるパッケージ（F-19）
packages:
  - drizzle-orm
  - drizzle-kit
# 回答に合うときだけ足すパッケージ（PostgreSQL のドライバ）
packages_when:
  - when: { database: postgresql }
    packages: [pg]
# 開発でだけ使うもの（生成する package.json の devDependencies に入れる）。残りは dependencies に入れる
dev_packages: [drizzle-kit]
# ひな形で動作を確かめたバージョン。ハーネスのリリースごとに更新する
verified_versions:        # 2026-09-30 試作（Issue #18）で確認
  drizzle-orm: "0.45.3"
  drizzle-kit: "0.31.11"
  pg: "8.23.0"          # 2026-09-30 に PostgreSQL 18.6 で確認
# 組み合わせの条件のうち、版の範囲で表せるもの（文章の説明は compatibility_notes に残す）
version_ranges:
  pg: ">=8.13.0"        # node-postgres 8.13.0 以上
# 組み合わせる道具の条件（試作で見つかったもの）
compatibility_notes:
  - "PostgreSQLのドライバは pg（node-postgres 8.13.0 以上）。2026-09-30 に pg 8.23.0・PostgreSQL 18.6 で確認"
  - "vitest-pool-workers の中では pg を読み込めない。Workers＋PostgreSQL は wrangler dev に対するAPIのテストで確かめる"
  - "D1では db.transaction() を使わず db.batch() を使う"
# 引用する共通の部分
includes:
  - data-access/_shared
# 出力するSkillの名前
skill_name: data-access-drizzle
files:
  files/sample-user.repository.ts: backend/src/db/sample-user.repository.ts
  files/sample-users.service.ts: backend/src/services/sample-users.service.ts
  files/sample-users.service.test.ts: backend/src/services/sample-users.service.test.ts
  files/sample-users.route.ts: backend/src/routes/sample-users.ts
  files/index.ts: backend/src/index.ts
  files/seed.sql: backend/db/seeds/seed.sql
  files/cleanup.sql: backend/db/seeds/cleanup.sql
# DB の種類で変わるファイル。マイグレーション（SQL と meta の journal・snapshot）は、drizzle-kit generate で実際に作ったもの
files_when:
  - when: { answer: database, equals: d1 }
    files:
      files/database.d1.ts: backend/src/db/database.ts
      files/schema.d1.ts: backend/db/schema.ts
      files/drizzle.d1.config.ts: drizzle.config.ts
      files/sample-user.repository.test.ts: backend/src/db/sample-user.repository.test.ts
      files/sample-users.route.test.ts: backend/src/routes/sample-users.test.ts
      files/migrations-d1/0000_init.sql: backend/db/migrations/0000_init.sql
      files/migrations-d1/meta/_journal.json: backend/db/migrations/meta/_journal.json
      files/migrations-d1/meta/0000_snapshot.json: backend/db/migrations/meta/0000_snapshot.json
  - when: { answer: database, equals: postgresql }
    files:
      files/database.pg.ts: backend/src/db/database.ts
      files/schema.pg.ts: backend/db/schema.ts
      files/drizzle.pg.config.ts: drizzle.config.ts
      files/migrations-pg/0000_init.sql: backend/db/migrations/0000_init.sql
      files/migrations-pg/meta/_journal.json: backend/db/migrations/meta/_journal.json
      files/migrations-pg/meta/0000_snapshot.json: backend/db/migrations/meta/0000_snapshot.json
# wrangler.jsonc に足す設定。D1 は migrations_dir まで。PostgreSQL は Hyperdrive の名前だけ（手元の接続先は環境変数で渡す。ここに書かない）
wrangler_when:
  - when: { answer: database, equals: d1 }
    wrangler:
      d1_databases:
        - binding: DB
          database_name: "{{app_name}}-db"
          migrations_dir: backend/db/migrations
  - when: { answer: database, equals: postgresql }
    wrangler:
      hyperdrive:
        - binding: HYPERDRIVE
          id: HYPERDRIVE_ID
      compatibility_flags: [nodejs_compat]
package_json_when:
  - when: { answer: database, equals: d1 }
    package_json:
      scripts:
        db:generate: "node scripts/db-local.ts development generate"
        db:migrate:local: "node scripts/db-local.ts development migrate"
        db:seed:local: "node scripts/db-local.ts development seed"
        db:reset:local: "node scripts/db-local.ts development reset"
        db:cleanup: "node scripts/db-local.ts development cleanup"
        db:migrate:test: "node scripts/db-local.ts test migrate"
        db:seed:test: "node scripts/db-local.ts test seed"
        db:reset:test: "node scripts/db-local.ts test reset"
        db:cleanup:test: "node scripts/db-local.ts test cleanup"
  - when: { answer: database, equals: postgresql }
    package_json:
      scripts:
        db:generate: "node scripts/db-local.ts development generate"
        db:migrate: "node scripts/db-local.ts development migrate"
        db:seed:local: "node scripts/db-local.ts development seed"
        db:reset:local: "node scripts/db-local.ts development reset"
        db:cleanup: "node scripts/db-local.ts development cleanup"
        db:migrate:test: "node scripts/db-local.ts test migrate"
        db:seed:test: "node scripts/db-local.ts test seed"
        db:reset:test: "node scripts/db-local.ts test reset"
        db:cleanup:test: "node scripts/db-local.ts test cleanup"
