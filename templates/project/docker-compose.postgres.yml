# 開発用の Docker Compose（C-36）。バックエンドを、本番と同じ実行エンジン（workerd）で動かし、PostgreSQL のコンテナにつなぐ。
# 認証情報などは、このファイルに直接書かず、.env から読む（C-05）。
name: {{app_name}}

services:
  db:
    container_name: {{app_name}}-db
    image: postgres:{{postgres_image_tag}}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env に POSTGRES_USER を書いてください}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を書いてください}
      POSTGRES_DB: ${POSTGRES_DB:?.env に POSTGRES_DB を書いてください}
      # コンテナの中の psql（npm run db:* が使う）の接続先
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
    ports:
      # 手元（コンテナの外）の drizzle-kit などからつなぐための口。外のネットワークには開けない
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    container_name: {{app_name}}-backend
    image: node:{{node_version}}
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5173}:5173"
    environment:
      # コンテナの中からは、db のサービス名でつなぐ（.env の localhost の接続先を上書きする）
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - .:/app
      # Windows・macOS の手元の node_modules とは分け、コンテナの中のものを使う
      - node_modules:/app/node_modules
      # 手元の状態（wrangler）。コンテナを作り直しても消えないようにする
      - wrangler_state:/app/.wrangler/state

volumes:
  db_data:
  node_modules:
  wrangler_state:
