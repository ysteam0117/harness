  C-62:
    title: バージョンの固定
    method: stack
    stack: { class: runtime }
  C-63: { title: アップロードしたファイルの非公開, method: manual }
  C-64: { title: トランザクションの範囲, method: answers, rule: C-64 }
  C-65: { title: バッチ処理, method: manual }
  C-66: { title: 実装の役割分担の流れ, method: answers, rule: C-66 }
  C-67: { title: AI の報告を日本語で書く, method: manual }
  C-68:
