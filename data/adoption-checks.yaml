  C-69: { title: テスト環境の構築手順, method: manual }
  C-70: { title: 外部 API のテストにモックを使う, method: manual }
  C-71: { title: エラーをもみ消さない, method: harness_files, files: [AGENTS.md] }
  C-72: { title: SQL はパラメータで渡す, method: manual }
  C-73: { title: 予期しないエラーのグローバル処理, method: manual }
  C-74: { title: 外部 API の版の固定, method: manual }
  C-75: { title: 取り消しが難しい操作の扱い, method: harness_files, files: [AGENTS.md] }
  C-76: { title: 要件定義とプロトタイプ, method: manual }
  C-77: { title: 操作結果のすぐの反映, method: answers, rule: C-77 }
  C-78: { title: ハーネスの改善点の記録, method: manual }
  C-79: { title: 壊そうとしても壊れないことのテスト, method: answers, rule: C-79 }
  C-80: { title: プロジェクト固有のルールの文書, method: manual }
  C-81: { title: 設計書（docs/design/）, method: manual }
  C-82:
