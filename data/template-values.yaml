# README.md
readme_repository_setup:
  - when: { answer: repository, equals: local }
    value: |-
      GitHub は使わず、手元の Git だけで管理します。`main` の保護と品質チェックは、Git のフック（`.githooks/pre-commit`）と、取り込みのコマンド（`npm run merge:check`）で行います。

      1. Git を用意する：`git init -b main`
      1. フックを有効にする：`git config core.hooksPath .githooks`（`main` の上での直接のコミットなどを止めます。外さないでください）
      1. 依存を入れる：`npm install`（コミットの前の確認に、Prettier と ESLint を使います）
      1. 秘密情報の確認の道具を入れる（任意）：gitleaks を入れると、コミットの前に秘密情報の混入を確かめます（例：`brew install gitleaks`・`winget install gitleaks`）。入っていないときは、警告を表示して続けます
      1. 最初のコミットをする：`git add -A` のあと `git commit -m "chore: 生成した初期状態"`（まだコミットがないので、`main` の上でもフックが許します）
      1. 作業のブランチを作る：`git switch -c feature/1-replace-icons`（`<種類>/<Issue番号>-<内容>`。番号は `docs/issues/` の Issue の番号に合わせます）
      1. 作業して、ブランチにコミットする。Issue の記録（レビューの結果・受け入れ条件の確認・知見）は `docs/issues/` のファイルに書きます
      1. 取り込む：`npm run merge:check`（別のブランチを取り込むときは `npm run merge:check -- <ブランチ名>`）

      `npm run merge:check` は、作業ツリーがきれいで、ブランチ名が `<種類>/<番号>-<内容>` であることを確かめ、`main` に変更を足した状態で `npm run check` を実行します。通った場合だけ、`main` に Squash でコミットし、Issue のファイルの状態を「完了」にします。失敗したときは、`main` に何も残さず、元のブランチに戻って理由を表示します（直してから、もう一度実行してください）。
  - value: |-
      GitHub のアカウントとの紐付け（`gh auth login`）は、利用者が自分で行います。

      1. GitHub にログインする：`gh auth login`
      1. Git を用意して、最初のコミットをする：`git init -b main` のあと `git add -A`、`git commit -m "chore: 生成した初期状態"`
      1. リポジトリを作って push する：`gh repo create {{app_name}} {{repo_visibility_flag}} --source=. --push`
      {{readme_env_test_step}}
      1. `main` を保護する：下の「`main` ブランチの保護」の手順で設定する
      1. 仮のアイコンの Issue を作る：下の「仮のアイコン」の手順で作る

readme_env_test_step:
  - when: { answer: check_location, in: [github_actions, both] }
    value: "1. 品質チェックの検証用の環境変数を登録する：GitHub のリポジトリの Secrets に `ENV_TEST`（`.env.test` の中身）を登録する。手順は `docs/secrets.md` の CI の章。`gh secret set` は値を入力するコマンドのため、利用者が自分で実行します（AI には実行させません）"
  - value: "1. 品質チェックは手元で実行するため、Secrets の登録は要りません"

readme_icons_issue:
  - when: { answer: repository, equals: local }
    value: 差し替えの作業は、Issue のファイル `docs/issues/0001-replace-icons.md` で管理します。作業のブランチ（`feature/1-replace-icons`）を作って差し替え、`npm run merge:check` で取り込んでください。
  - value: |-
      差し替えの作業は、Issue のテンプレート「仮のアイコンの差し替え」（`.github/ISSUE_TEMPLATE/replace-icons.md`）で Issue にして管理します。リポジトリを GitHub に作ったら、最初に次のどちらかで Issue を作ってください。

      - GitHub の画面：「Issues」→「New issue」→「仮のアイコンの差し替え」
      - コマンド：`gh issue create --template "仮のアイコンの差し替え"`

readme_branch_protection:
  - when: { answer: repository, equals: local }
    value: |-
      `main` の上での直接のコミットは、フック（`.githooks/pre-commit`）が止めます。`main` に取り込めるのは、`npm run merge:check` が、品質チェックを通した変更をコミットするときだけです。

      - フックは、`git config core.hooksPath .githooks` を実行したリポジトリで有効になります。clone し直したときは、もう一度実行してください
      - フックを外して、確認を飛ばさないでください
  - value: |-
      `main` への直接の push と強制 push（force push）を禁止します。リポジトリを GitHub に作ったら、次の設定をしてください。

      1. GitHub のリポジトリの「Settings」→「Rules」→「Rulesets」→「New ruleset」→「New branch ruleset」を開く
      1. 「Ruleset Name」に `main の保護` と入れ、「Enforcement status」を「Active」にする
      1. 「Target branches」で「Add target」→「Include default branch」を選ぶ
      1. 「Restrict deletions」「Require a pull request before merging」「Block force pushes」に印を付ける
      1. 品質チェックを GitHub Actions で実行する場合は、「Require status checks to pass」に印を付け、`check` を追加する
      1. 「Create」で保存する

readme_merge_command_row:
  - when: { answer: repository, equals: local }
    value: |-
      | `git switch -c <種類>/<番号>-<内容>` | 作業のブランチを作る（`AGENTS.md` の「作業の流れ」） |
      | `npm run merge:check` | 今のブランチを、品質チェックが通ったときだけ `main` に Squash で取り込む（`-- <ブランチ名>` で指定もできる） |
  - value: "| `git switch -c <種類>/<番号>-<内容>` | 作業のブランチを作る（`AGENTS.md` の「作業の流れ」） |"

secrets_ci_setup:
  - when: { answer: repository, equals: local }
    value: |-
      ## 品質チェック（手元のPC）

      品質チェックは手元で `npm run check` を実行する。検証用の値は `.env.test` に設定する（上の「開発・検証」の手順）。
  - value: |-
      ## CI（GitHub Actions）

      - GitHubのリポジトリの Settings → Secrets and variables → Actions で登録する
      - または、次を実行して、聞かれた値を入力する

        ```bash
        gh secret set <項目名>
        ```
