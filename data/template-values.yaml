# AGENTS.md「作業の流れ」の手順1と、手順5〜7、その下の箇条書き
workflow_issue_step:
  - when: { answer: repository, equals: local }
    value: "1. **Issueを作る**：Issueなしで作業を始めない。`docs/issues/_template.md`を写して、`docs/issues/<番号4桁>-<内容>.md`を作る（番号は1ずつ増やす。例：`0012-login.md`）。機能は親Issue、作業領域（DB・バックエンド・フロントエンド・その他）ごとに子Issueに分け、子のファイルの「親」に親の番号を書く"
  - value: "1. **Issueを作る**：Issueなしで作業を始めない。機能は親Issue、作業領域（DB・バックエンド・フロントエンド・その他）ごとに子Issueに分ける"

workflow_review_steps:
  - when: { answer: repository, equals: local }
    value: |-
      5. **記録を書く**：レビューの結果（レビューしたAI・指摘・採用したか・採用しなかった理由）と、受け入れ条件ごとの確認の結果を、Issueのファイルに追記する。着手したら状態を「作業中」にする。「知見」の欄は必ず埋める
      6. **取り込む**：統括は手元の必須確認と対象コミットを照合し、Issueのファイルに記録する。`npm run merge:check`で統合後の全体確認が通った場合だけ、`main`にSquashで取り込まれる。結果も記録し、失敗したときは修正と再確認を行う
      7. **Issueの状態を確かめる**：取り込みのコマンドが、Issueのファイルの状態を「完了」にしたことを確かめる
  - value: |-
      5. **PRを作る**：統括はpush前に手元の秘密情報確認の成功を確かめる。本文に `Closes #<子Issue番号>`、親Issueは `Refs #<親Issue番号>` を書く。PRテンプレートの「知見」の欄は必ず埋める
      6. **マージする**：統括は最終候補の必須確認と、必要なCIの成功を対象コミットで照合し、PR本文に記録する。必須のCIが失敗・未実行・古い結果ならマージを止める。成功を確認して**Squash**でマージする
      7. **Issueのクローズを確かめる**：`Closes`で指定したIssueが自動でクローズされたかを確かめる。されていなければ、PRの番号を書いたコメントを付けて手動でクローズする

workflow_main_rules:
  - when: { answer: repository, equals: local }
    value: |-
      - **`main`の上で直接コミットしない**。フック（`.githooks/pre-commit`）が止める。変更はすべて作業のブランチから、`npm run merge:check`で取り込む
      - フックを外して、確認を飛ばさない。コミットの前の確認（秘密情報・整形・Lint）で止まったら、原因を直す
  - value: |-
      - **`main`へ直接pushしない**。変更はすべてPR経由で取り込む
      - 複数人で開発している場合は、作業開始前・push前・マージ前に、リモートの最新状態と比べてコンフリクトがないかを確認する

# Skill「実装の進め方」
commit_merge_step:
  - when: { answer: repository, equals: local }
    value: "**コミット・取り込み**：`AGENTS.md`の「作業の流れ」に従い、統括が手元の必須確認を照合する。取り込みの成否と対象コミットをIssueのファイルに記録し、状態が「完了」になったかを確かめる"
  - value: "**コミット・PR・マージ**：`AGENTS.md`の「作業の流れ」に従い、統括がpush前の秘密情報確認とマージ前の必須CIを含む確認を照合し、PR本文に記録する。マージの後、`Closes`で指定したIssueがクローズされたかを確かめ、されていなければPRの番号を書いたコメントを付けて手動でクローズする"

prev_merged_check:
  - when: { answer: repository, equals: local }
    value: 直前のIssueが、`npm run merge:check`で`main`に取り込み済みである
  - value: 直前のIssueのPRがマージ済みである

# Skill「テスト」の、道具の一覧の1行
dependency_update_row:
  - when: { answer: repository, equals: local }
    value: "| 依存関係の更新の確認 | `npm outdated` | 定期的に | 更新は、バージョンを確かめてから、Issueにして取り込む |"
  - value: "| 依存関係の更新の通知 | Dependabot | 常時 | 更新のPRは、バージョンを確かめてから取り込む |"

# npm の Dependabot 設定に入れる Hono 向けの制限（#105）。差し込み先に合わせ、行頭の空白と最後の改行を残す。
dependabot_vitest_ignore:
  - when: { answer: backend, equals: hono }
    value: |2
          # Workers 用パッケージの Vitest 5 対応をハーネスが検証したら、harness update で制限が外れる。根拠は docs/tech-stack.md の「組み合わせの条件」を参照する。
          ignore:
            - dependency-name: vitest
              update-types: ["version-update:semver-major"]
  - value: ""

# docs/testing/security.md の、依存ライブラリの更新の通知の節の本文（#42・#105）
security_dependabot_section:
  - when: { answer: repository, equals: local }
    value: GitHub を使わない（手元の Git だけの）ため、Dependabot は使わない。依存の更新は、定期的に `npm outdated` で確かめ、Issue にして、固定したまま動作を確かめてから取り込む（C-62）。
  - when: { answer: backend, equals: hono }
    value: |-
      `.github/dependabot.yml` が npm・GitHub Actions・Docker Compose の依存を毎週確かめ、更新の PR を作る。Vitest と Workers 用の `@cloudflare/vitest-pool-workers` の定期更新は `vitest-packages` にまとめる。残りの npm の依存は本番用と開発用に分ける。更新の PR は、品質チェックを通したうえで、固定したまま動作を確かめてから取り込む（C-62）。

      Workers 用パッケージが Vitest 5 に対応するまで、Vitest のメジャー版の定期更新を止める。4系のマイナー・パッチとセキュリティ更新は対象に残る。現在の根拠は `docs/tech-stack.md` の「組み合わせの条件」で確かめる。ハーネスが Vitest 5 に対応した組み合わせを検証した後、`harness update` で解除を反映する。先に手で外すと、管理ファイルの編集として更新時に差分が出る。

      依存を解決できない更新 PR では、Workers 用パッケージの peer 依存を確かめる。セキュリティ更新の PR なら、閉じる前に4系に修正版があるかを確かめる。修正版が無ければ、影響範囲、開発用の依存であること、追跡先を Issue に記録する。互換性のない更新 PR を閉じる場合は、互換性を確かめた組み合わせで別の更新を行う（C-62）。
  - value: |-
      `.github/dependabot.yml` が npm と GitHub Actions の依存を毎週確かめ、更新の PR を作る。Vitest の定期更新は専用の `vitest-packages` グループで扱う。残りの npm の依存は本番用と開発用に分ける。更新の PR は、品質チェックを通したうえで、固定したまま動作を確かめてから取り込む（C-62）。

# GitHub に作るリポジトリの公開範囲（gh repo create の引数）
repo_visibility_flag:
  - when: { answer: visibility, equals: public }
    value: "--public"
  - value: "--private"

# README.md
readme_repository_setup:
  - when: { answer: repository, equals: local }
    value: |-
      GitHub は使わず、手元の Git だけで管理します。`main` の保護と品質チェックは、Git のフック（`.githooks/pre-commit`）と、取り込みのコマンド（`npm run merge:check`）で行います。

      1. Git を用意する：`git init -b main`
      1. フックを有効にする：`git config core.hooksPath .githooks`（`main` の上での直接のコミットなどを止めます。外さないでください）
      1. 依存を入れる：`npm install`（コミットの前の確認に、Prettier と ESLint を使います）
      1. 秘密情報の確認の道具を入れる（任意）：gitleaks を入れると、コミットの前に秘密情報の混入を確かめます（例：`brew install gitleaks`・`winget install gitleaks`）。入っていないときは、警告を表示して続けます
      1. 最初のコミットをする：`git add -A` のあと `git commit -m "chore: 生成した初期状態"`（まだコミットがないので、`main` の上でもフックが許します）
      1. 作業のブランチを作る：`git switch -c feature/1-replace-icons`（`<種類>/<Issue番号>-<内容>`。番号は `docs/issues/` の Issue の番号に合わせます）
      1. 作業して、ブランチにコミットする。Issue の記録（レビューの結果・受け入れ条件の確認・知見）は `docs/issues/` のファイルに書きます
      1. 取り込む：`npm run merge:check`（別のブランチを取り込むときは `npm run merge:check -- <ブランチ名>`）

      `npm run merge:check` は、作業ツリーがきれいで、ブランチ名が `<種類>/<番号>-<内容>` であることを確かめ、`main` に変更を足した状態で `npm run check` を実行します。通った場合だけ、`main` に Squash でコミットし、Issue のファイルの状態を「完了」にします。失敗したときは、`main` に何も残さず、元のブランチに戻って理由を表示します（直してから、もう一度実行してください）。
  - value: |-
      GitHub のアカウントとの紐付け（`gh auth login`）は、利用者が自分で行います。

      1. GitHub にログインする：`gh auth login`
      1. Git を用意して、最初のコミットをする：`git init -b main` のあと `git add -A`、`git commit -m "chore: 生成した初期状態"`
      1. リポジトリを作って push する：`gh repo create {{app_name}} {{repo_visibility_flag}} --source=. --push`
      {{readme_env_test_step}}
      1. `main` を保護する：下の「`main` ブランチの保護」の手順で設定する
      1. 仮のアイコンの Issue を作る：下の「仮のアイコン」の手順で作る

readme_env_test_step:
  - when: { answer: check_location, in: [github_actions, both] }
    value: "1. 品質チェックの検証用の環境変数を登録する：GitHub のリポジトリの Secrets に `ENV_TEST`（`.env.test` の中身）を登録する。手順は `docs/secrets.md` の CI の章。`gh secret set` は値を入力するコマンドのため、利用者が自分で実行します（AI には実行させません）"
  - value: "1. 品質チェックは手元で実行するため、Secrets の登録は要りません"

readme_icons_issue:
  - when: { answer: repository, equals: local }
    value: 差し替えの作業は、Issue のファイル `docs/issues/0001-replace-icons.md` で管理します。作業のブランチ（`feature/1-replace-icons`）を作って差し替え、`npm run merge:check` で取り込んでください。
  - value: |-
      差し替えの作業は、Issue のテンプレート「仮のアイコンの差し替え」（`.github/ISSUE_TEMPLATE/replace-icons.md`）で Issue にして管理します。リポジトリを GitHub に作ったら、最初に次のどちらかで Issue を作ってください。

      - GitHub の画面：「Issues」→「New issue」→「仮のアイコンの差し替え」
      - コマンド：`gh issue create --template "仮のアイコンの差し替え"`

readme_branch_protection:
  - when: { answer: repository, equals: local }
    value: |-
      `main` の上での直接のコミットは、フック（`.githooks/pre-commit`）が止めます。`main` に取り込めるのは、`npm run merge:check` が、品質チェックを通した変更をコミットするときだけです。

      - フックは、`git config core.hooksPath .githooks` を実行したリポジトリで有効になります。clone し直したときは、もう一度実行してください
      - フックを外して、確認を飛ばさないでください
  - value: |-
      `main` への直接の push と強制 push（force push）を禁止します。リポジトリを GitHub に作ったら、次の設定をしてください。

      1. GitHub のリポジトリの「Settings」→「Rules」→「Rulesets」→「New ruleset」→「New branch ruleset」を開く
      1. 「Ruleset Name」に `main の保護` と入れ、「Enforcement status」を「Active」にする
      1. 「Target branches」で「Add target」→「Include default branch」を選ぶ
      1. 「Restrict deletions」「Require a pull request before merging」「Block force pushes」に印を付ける
      1. 品質チェックを GitHub Actions で実行する場合は、「Require status checks to pass」に印を付け、`check` を追加する
      1. 「Create」で保存する

readme_merge_command_row:
  - when: { answer: repository, equals: local }
    value: |-
      | `git switch -c <種類>/<番号>-<内容>` | 作業のブランチを作る（`AGENTS.md` の「作業の流れ」） |
      | `npm run merge:check` | 今のブランチを、品質チェックが通ったときだけ `main` に Squash で取り込む（`-- <ブランチ名>` で指定もできる） |
  - value: "| `git switch -c <種類>/<番号>-<内容>` | 作業のブランチを作る（`AGENTS.md` の「作業の流れ」） |"

secrets_ci_setup:
  - when: { answer: repository, equals: local }
    value: |-
      ## 品質チェック（手元のPC）

      品質チェックは手元で `npm run check` を実行する。検証用の値は `.env.test` に設定する（上の「開発・検証」の手順）。
  - value: |-
      ## CI（GitHub Actions）

      - GitHubのリポジトリの Settings → Secrets and variables → Actions で登録する
      - または、次を実行して、聞かれた値を入力する

        ```bash
        gh secret set <項目名>
        ```

