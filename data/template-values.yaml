      - このプロジェクトはDBを使わないため、データアクセスのライブラリは決めていない
      - DBを足すときは、利用者と相談して技術を選び、理由をADRに記録する

# README.md の「最初の手順」の、DB を用意する手順（1行の箇条書き。DBがないときは使わない旨だけ）
readme_db_setup:
  - when: { answer: database, equals: d1 }
    value: |-
      1. DB（手元の D1）を用意する：`.env.example`を`.env.development`へコピーして`APP_ENV=development`を設定し、`npm run db:migrate:local`でテーブルを作り、`npm run db:seed:local`で開発用の架空のデータを入れる
  - when: { answer: database, equals: postgresql }
    value: |-
      1. DB（PostgreSQL）を用意する：`.env.example`を`.env.development`へコピーし、`APP_ENV=development`と手元の`POSTGRES_*`・`DATABASE_URL`・`CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE`を設定する（接続先・ポート・資格情報を整合させる）。`npm run docker:up:local`でDBを起動し、`npm run db:migrate`でテーブルを作り、`npm run db:seed:local`で開発用の架空のデータを入れる。品質チェック（`npm run check`）には、PostgreSQL の例のテスト（`npm run test:db`）が含まれるため、`.env.test`も用意し、`npm run docker:up:test`で検証用のDBを起動してから実行する
  - value: |-
      1. DB：使いません（足すときは、利用者と相談して技術を選び、理由を ADR に記録します）

# README.md の「よく使うコマンド」の、DB のコマンドの表の行（DBがないときは何も足さない）
readme_db_commands:
  - when: { answer: database, equals: d1 }
    value: |-
      | `npm run db:generate -- --name <内容>` | スキーマ（`backend/db/schema.ts`）の変更から、マイグレーションを作る |
      | `npm run db:migrate:test`・`npm run db:seed:test`・`npm run db:reset:test` | 検証用D1（環境別保存先）にマイグレーション・シード・再作成を行う |
      | `npm run db:migrate:local` | 手元の D1 に、マイグレーションを適用する |
      | `npm run db:seed:local` | 開発用の架空のデータを入れる |
      | `npm run db:reset:local` | 手元の D1 を作り直す（マイグレーションとシードを、もう一度適用する） |
      | `npm run db:cleanup` | テストデータ（`testuser_` で始まるもの）だけを消す |
  - when: { answer: database, equals: postgresql }
    value: |-
      | `npm run db:generate -- --name <内容>` | スキーマ（`backend/db/schema.ts`）の変更から、マイグレーションを作る |
      | `npm run db:migrate:test`・`npm run db:seed:test`・`npm run db:reset:test` | 検証用PostgreSQL（DB名末尾`_test`）にマイグレーション・シード・再作成を行う |
      | `npm run db:migrate` | 手元の DB に、マイグレーションを適用する（`DATABASE_URL` の接続先） |
      | `npm run db:seed:local` | 開発用の架空のデータを入れる（手元の DB のコンテナに、`docker compose exec` で流す） |
      | `npm run db:reset:local` | 手元の DB を作り直す（マイグレーションとシードを、もう一度適用する） |
      | `npm run db:cleanup` | テストデータ（`testuser_` で始まるもの）だけを消す |
      | `npm run test:db` | PostgreSQL の例のテスト（`backend/src/rules-examples/*.db.test.ts`）。`npm test`の後に自動で動く。検証用DB（`npm run docker:up:test`）の起動が要る。その接続だけの一時的な表を使い、既存のデータには触れない |
  - value: ""

# README.md の「Docker で動かす」に足す、DB の説明（箇条書きの行。DBがないときは何も足さない）
readme_docker_db:
  - when: { answer: database, equals: d1 }
    value: |-
      - Dockerで使うD1は、手元のD1と別のデータです。`npm run docker:up:local`で起動し、コンテナの初回は`docker compose exec -T backend npm run db:migrate:local`、続けて`docker compose exec -T backend npm run db:seed:local`を実行します
  - when: { answer: database, equals: postgresql }
    value: |-
      - 開発PostgreSQLのデータは開発用ComposeプロジェクトのDBボリュームに残ります。テーブルは`npm run db:migrate`、開発用の架空のデータは`npm run db:seed:local`で入れます。検証は`npm run docker:up:test`で別プロジェクト・別DBを起動します
  - value: ""

# 結合テストの手順書（docs/testing/integration.md、C-69）。DB の回答で変わる
integration_tools:
  - when: { answer: database, equals: postgresql }
    value: "| Docker（検証用の PostgreSQL のコンテナ） | `docker-compose.yml` の版 | PC に Docker を入れる |"
  - when: { answer: database, equals: d1 }
    value: "| ローカルの D1 | wrangler に含まれる | `npm install`（コンテナは使わない） |"
  - value: "| DB | DBは使わないため、対象外 | — |"

integration_setup:
  - when: { answer: database, equals: postgresql }
    value: "1. 検証用の DB のコンテナを起動する：`npm run docker:up:test`（DB 名は `_test` で終わる）\n1. マイグレーションを適用する：`npm run db:migrate:test`"
  - when: { answer: database, equals: d1 }
    value: "1. テスト用の D1 は、`npm test` のときに一時的に作られ、マイグレーションが適用される（準備は不要）"
  - value: "1. DBは使わないため、DB の準備はない"

integration_verify:
  - when: { answer: database, equals: postgresql }
    value: "- `docker compose ps` で、検証用の DB のコンテナが動いている"
  - when: { answer: database, equals: d1 }
    value: "- `npm test` の最初に、マイグレーションの適用が失敗していない"
  - value: "- DBは使わないため、DB の確認はない"

integration_cleanup:
  - when: { answer: database, equals: postgresql }
    value: "- テストデータを消す：`npm run db:cleanup:test`（`testuser_` で始まる行だけを消す）\n- コンテナを止める：`npm run docker:down:test`。ポートが解放されたことを確かめる"
  - when: { answer: database, equals: d1 }
    value: "- テスト用の D1 は、テストの終わりに消える。開発用の D1（`npm run dev`）には触れない"
  - value: "- DBは使わないため、DB の後始末はない。起動したものがあれば止める"

