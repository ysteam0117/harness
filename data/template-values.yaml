# Skill「テスト」「環境・デプロイ」、エージェント「品質チェック」の、生成したアプリのコマンド・文書・環境の分離を前提にした箇所
test_env_notes: |-
  環境別の起動は `npm run test` と `npm run dev:test` を使う。手元の `.env.test` と `APP_ENV=test` が選ばれ、親プロセスの接続設定は引き継がれない
  - PostgreSQLの検証DBはループバック上の接続先かつ名前が `_test` で終わるものを使う。D1/R2のローカル状態は開発用から分離される。これは任意の外部接続やOS権限を含む安全保証ではない
  - テスト用PostgreSQL/Composeの起動・停止は `npm run docker:up:test`・`npm run docker:down:test`、DB操作は `db:*:test` のscriptsを使う。Vitest WorkersのD1は一時的な隔離状態を使う
  - PostgreSQLのプロジェクトでは、品質チェック（`npm run check`）の`npm test`の後に、`posttest`が`npm run test:db`（Skillの良い例・悪い例のテスト`backend/src/rules-examples/*.db.test.ts`。Node.jsの別の設定`vitest.db.config.ts`）を実行する。検証用DBが起動していないと失敗するため、先に`npm run docker:up:test`で起動する。このテストは、その接続だけの一時的な表（`CREATE TEMP TABLE`）だけを使い、マイグレーション・シード・既存のデータには触れない。開発用のコンテナの中には検証用のDBがないため、コンテナの中で実行するときは、検証用のコンテナの中で行う
test_docs_rule: "手順は`docs/testing/`に、テストの種類ごとに書いてある（必要なもの・構築の手順・確認の方法・実行方法・後始末・よくある失敗と対処）"
check_command_detail: "`{{check_command}}`は、Dockerを使わない`npm run check:app`（Lint・型・書式・依存の向き・重複・テスト・`npm audit`）に、Dockerで動くセキュリティのテスト（`npm run security`：Semgrep・gitleaks・OSV-Scanner）を足したもの。**ホストで実行する**。Docker（開発用のコンテナ）の中では`npm run check:app`を実行する（コンテナの中からはDockerを使えない）。セキュリティのテストの手順・合否・誤検知の抑え方は`docs/testing/security.md`"
security_procedure_ref: "手順は`docs/testing/security.md`"
schemathesis_rule: "Schemathesisは、API仕様書（`docs/api/openapi.json`）から異常な入力を作って、動いているAPIに送る。`npm run check`には入れず、開発サーバーを起動して、`docs/testing/schemathesis.md`の手順で実行する（本番には向けない）。APIを足す・変えたら、仕様書も同じ変更の中で直す（食い違うと`backend/src/openapi.test.ts`が失敗する）"
pentest_plan_place: "`docs/testing/pentest-plan.md`"
test_isolation_notes: |-
  - テストのコマンドは、`.env.test`だけを読み込む
  - テストを始める前に、`APP_ENV`が`test`で、DBの接続先が手元であることを確かめ、違えば止める
  - `npm run env:check`と起動のときに、今の環境の名前を表示する（値は表示しない）
  - テストのスクリプトでは、wranglerの`--remote`を使わない
test_docs_paren: "（`docs/testing/`）"
quality_checker_command_step: "手元とCIで共通の1つのコマンド（例：`npm run check`）で、**プロジェクト全体**に対して品質チェックとテストを実行する。一部のフォルダだけに限定しない"

