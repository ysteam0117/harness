# ひな形（templates/）の {{名前}} に入れる値のうち、回答の条件で決まるもの（F-28）。
# 書き方：
#   名前: 値                       常に同じ値
#   名前:                          回答の条件で選ぶ。上から順に見て、最初に条件に合うものを使う
#     - when: { answer: <質問の id>, equals | in | notEquals: ... }
#       value: 値
#     - value: 値                  when を書かない行は、常に合う（最後に書いて、既定にする）
# 条件の書き方は consistency-rules.yaml の answer 条件と同じ。複数の条件をすべて満たすときは、
#   when: { all: [{ answer: ... }, { answer: ... }] } と書く（#72）。
#
# ここに書かない値は、回答から計算する（src/generate/values.ts）：
#   app_name・java_package・java_package_path（Java のパッケージ名。javaPackageName）・auth_method・database・asvs_level・pentest_requirement・judgment_table・enabled_rules・undecided_items・requirements_feature_items・
#   knowledge_index・secrets_table・license_year（生成した年。project.ts）・
#   compatibility_date（runtimes.yaml）・役割とモデル（role-models.yaml）

check_command: npm run check

# 全役割に共通する委譲時の指示と、テスト Skill の案内（C-66・F-21）
delegated_worker_rule: >-
  承認が必要な操作の範囲は、`AGENTS.md`の「破壊的な操作は、必ず利用者の判断を仰ぐ」、デプロイの承認（C-41）、AIの設定の`ask`・`prompt`に従う。操作の実行前に何を・なぜ・範囲・取り消し方をすぐ統括に報告し、指示を待つ。拒否された操作を別の手段で回避しない。手元の設定や起動時の指定で利用者の承認を省かない。ツールが実行を許可していても、必要な承認を得るまで操作を保留する。モードの確認や切り替えのために手元や利用者の設定ファイルを読み書きしない。承認が省かれる設定に気づいた場合やモードの確認・切り替えが必要な場合は、実行前に統括に報告する。作業用フォルダを割り当てられた場合は、削除せず場所を報告する。利用上限を確認した場合は統括に報告する。テストの計画・作成・レビュー・検証を担当する場合は、Skill「テスト」を読む。

process_report_instruction: >-
  工程の報告では、工程・担当の役割（分かればAI・モデル）・試行、確認できた開始・終了、待機の理由、再実行の元と理由、使用量の項目・数値・単位・範囲・取得元を統括に応答で伝える。時刻や値を推定せず、「未取得」と理由を書く。取得元の対象は工程名・試行番号・測定範囲で示す。この工程の記録は担当が編集しない。
  開始・終了は取得元で確認した時差付きで書く。使用量は累積・試行の値・差分のどれかと、総量・内訳の別、キャッシュを含むかを分かる範囲で添える。
  秘密情報の値、個人情報、生ログ（編集していない出力の全体）、内部URL（組織内や非公開のサービスのURL）、内部識別子（セッション、エージェント、実行環境やオーケストレーターの実行・タスク・依頼、アカウント、組織）は報告に含めない。
  既存の手順が求める作業用フォルダの場所・実行したコマンドは、従来の秘密情報の扱いに従って統括へ伝える。秘密情報・個人情報などを除いた診断に必要な抜粋と、ログの保存場所は統括に報告してよい。既存の手順が求める場合は、残存プロセスのPID・プロセス名・ポートも統括に報告する。

review_finding_criteria: >-
  重大（次の工程や取り込みを止める）は、根拠のある要件の未達・退行・安全上の問題・必要なテストの不足など。データ破損・認証の回避・情報漏えいにつながる指摘は必ず重大とする。軽微（受け入れ条件・安全・既存の確認を損ねない改善）は、修正するとよい指摘とする。根拠のない好みは修正要求にしない。
  記録で参照できる合意済みの判断は、根拠と前提が同じなら再指摘しない。要件の矛盾・退行・安全上の問題を示せる場合は、合意済みの判断に関係していても新しい証拠と影響を報告する。
  重大な指摘がなくても、必要な範囲が未確認なら終了可と報告しない。重大が0件で必要な範囲を確認できたら、その結果を統括に渡す。軽微の扱いを統括が記録してから終了を判断する。

review_agreement_sources:
  - when: { answer: repository, equals: local }
    value: ADR・Issueの記録
  - value: ADR・Issue・PRの記録

