  - when: { answer: database, notEquals: none }
    value: "| DB・クエリ・マイグレーション | `backend`・`data-access-drizzle` |"
  - value: "| DB・クエリ・マイグレーション | このプロジェクトは DB を使わない。DB を使うことになったら、要件定義に戻る |"

