# AGENTS.md「作業の流れ」の手順1と、手順5〜7、その下の箇条書き
workflow_issue_step:
  - when: { answer: repository, equals: local }
    value: "1. **Issueを作る**：Issueなしで作業を始めない。`docs/issues/_template.md`を写して、`docs/issues/<番号4桁>-<内容>.md`を作る（番号は1ずつ増やす。例：`0012-login.md`）。機能は親Issue、作業領域（DB・バックエンド・フロントエンド・その他）ごとに子Issueに分け、子のファイルの「親」に親の番号を書く"
  - value: "1. **Issueを作る**：Issueなしで作業を始めない。機能は親Issue、作業領域（DB・バックエンド・フロントエンド・その他）ごとに子Issueに分ける"

workflow_review_steps:
  - when: { answer: repository, equals: local }
    value: |-
      5. **記録を書く**：レビューの結果（レビューしたAI・指摘・採用したか・採用しなかった理由）と、受け入れ条件ごとの確認の結果を、Issueのファイルに追記する。着手したら状態を「作業中」にする。「知見」の欄は必ず埋める
      6. **取り込む**：作業のブランチでコミットしたあと、`npm run merge:check`を実行する。品質チェックとテストのすべて（`npm run check`）が通った場合だけ、`main`にSquashで取り込まれる。失敗したときは`main`に何も残らないので、直してもう一度実行する
      7. **Issueの状態を確かめる**：取り込みのコマンドが、Issueのファイルの状態を「完了」にしたことを確かめる
  - value: |-
      5. **PRを作る**：本文に `Closes #<子Issue番号>`、親Issueは `Refs #<親Issue番号>` を書く。PRテンプレートの「知見」の欄は必ず埋める
      6. **マージする**：テストと品質チェックが通っていることを確かめ、**Squash**でマージする
      7. **Issueのクローズを確かめる**：`Closes`で指定したIssueが自動でクローズされたかを確かめる。されていなければ、PRの番号を書いたコメントを付けて手動でクローズする

workflow_main_rules:
  - when: { answer: repository, equals: local }
    value: |-
      - **`main`の上で直接コミットしない**。フック（`.githooks/pre-commit`）が止める。変更はすべて作業のブランチから、`npm run merge:check`で取り込む
      - フックを外して、確認を飛ばさない。コミットの前の確認（秘密情報・整形・Lint）で止まったら、原因を直す
  - value: |-
      - **`main`へ直接pushしない**。変更はすべてPR経由で取り込む
      - 複数人で開発している場合は、作業開始前・push前・マージ前に、リモートの最新状態と比べてコンフリクトがないかを確認する

