# 生成するプロジェクトの、環境変数（秘密情報・環境ごとの設定）の項目の一覧（C-05・F-25）。
# docs/secrets.md の「設定する項目の一覧」の表になる。.env.example の項目（Issue #56）も、同じ一覧から作る。
# 実際の値は書かない。各環境で何を入れるかの説明だけを書く。
#
# name        : 環境変数の名前
# purpose     : 用途
# development : 開発（手元）で入れるもの
# test        : 検証（手元。テストが読む .env.test）で入れるもの
# production  : 本番（Cloudflare）で入れるもの
# example     : .env.example に書く値。書かなければ空。実際の値は書かない（空か、changeme・<…> のプレースホルダだけ）
# when        : 書かなければ常に入れる。書く場合は、質問の id（answer）と、equals・in・notEquals のどれか1つ。
#               複数の条件をすべて満たすときだけ入れる場合は、all に answer 条件を並べる（#72）
#
# 表のセルに | と改行は書かない。

- name: APP_ENV
  purpose: 環境の名前
  development: development
  test: test
  production: production
  example: development

- name: ALLOWED_ORIGINS
  purpose: 状態を変える要求を許可する送信元（カンマ区切り）
  development: 手元の画面のURL
  test: 手元の画面のURL
  production: 本番のドメイン（wrangler.jsonc の vars・IaC で設定する）
  example: http://localhost:5173

- name: APP_PORT
  purpose: Docker で動かすときに、手元で開くポート（docker-compose.yml が読む）
  development: 5173（ほかのアプリと重なるときだけ変える。変えたら ALLOWED_ORIGINS も合わせる）
  test: "5173"
  production: 使わない（Cloudflare の Workers で動く）
  example: "5173"

- name: POSTGRES_USER
  purpose: 手元の PostgreSQL のコンテナのユーザー名（docker-compose.yml が読む）
  development: 開発用に決めた名前
  test: 検証用に決めた名前（開発とは別にする）
  production: 使わない（本番の DB の認証情報は IaC・Hyperdrive の設定で決める）
  when: { answer: database, equals: postgresql }

- name: POSTGRES_PASSWORD
  purpose: 手元の PostgreSQL のコンテナのパスワード（docker-compose.yml が読む。URL で使える文字だけにする）
  development: 開発用に生成したランダムな値
  test: 検証用に生成したランダムな値（開発とは別にする）
  production: 使わない（本番の DB の認証情報は IaC・Hyperdrive の設定で決める）
  when: { answer: database, equals: postgresql }

- name: POSTGRES_DB
  purpose: 手元の PostgreSQL のコンテナのデータベース名（docker-compose.yml が読む）
  development: 開発用のデータベース名
  test: 末尾が _test の検証専用データベース名（開発とは別にする）
  production: 使わない
  example: app_dev
  when: { answer: database, equals: postgresql }

- name: POSTGRES_PORT
  purpose: 手元の PostgreSQL のコンテナを開くポート（docker-compose.yml が読む）
  development: 5432（ほかの PostgreSQL と重なるときだけ変える）
  test: "5432"
  production: 使わない
  example: "5432"
  when: { answer: database, equals: postgresql }

- name: DATABASE_URL
  purpose: PostgreSQL の接続先（パスワードを含む）。drizzle-kit（マイグレーション）が読む
  development: 手元のDBの接続先（localhost）
  test: 開発とは別の、手元の検証用DBの接続先
  production: Hyperdrive の設定（wrangler secret・IaC。手元のファイルには書かない）
  example: "<postgresql://ユーザー名:パスワード@localhost:5432/データベース名>"
  when: { answer: database, equals: postgresql }

- name: CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE
  purpose: 手元の開発サーバー（workerd）が、Hyperdrive の代わりにつなぐ PostgreSQL の接続先（Cloudflare が決めた名前。wrangler.jsonc には書かない）
  development: 手元のDBの接続先（localhost）。Docker の中では起動用スクリプトが db のサービス名に置き換える
  test: 開発とは別の、手元の検証用DBの接続先
  production: 使わない（本番は Hyperdrive の設定に従う）
  example: "<postgresql://ユーザー名:パスワード@localhost:5432/データベース名>"
  when: { answer: database, equals: postgresql }

- name: SESSION_SECRET
  purpose: ログインの状態（セッション）を署名する秘密の値
  development: 開発用に生成したランダムな値
  test: 検証用に生成したランダムな値（開発とは別にする）
  production: 本番用に生成したランダムな値（wrangler secret put で入力する）
  when: { answer: auth, notEquals: none }

- name: OIDC_CLIENT_ID
  purpose: 外部IdPに登録したアプリの識別子
  development: 開発用に登録した値
  test: 検証用に登録した値（開発とは別にする）
  production: 本番用に登録した値
  when: { answer: auth, in: [oidc, both] }

- name: OIDC_CLIENT_SECRET
  purpose: 外部IdPに登録したアプリの秘密の値
  development: 開発用に登録した値
  test: 検証用に登録した値（開発とは別にする）
  production: 本番用に登録した値（wrangler secret put で入力する）
  when: { answer: auth, in: [oidc, both] }

- name: OIDC_ISSUER
  purpose: 外部IdPの issuer の URL（IdP の公開情報。秘密ではない）
  development: 開発用に登録した IdP の issuer の URL
  test: 検証用に登録した IdP の issuer の URL（開発とは別にする）
  production: 本番用に登録した IdP の issuer の URL
  when: { answer: auth, in: [oidc, both] }

- name: OIDC_REDIRECT_URI
  purpose: 外部IdPに登録した、ログイン後に戻ってくる URL（コールバック）
  development: 手元の画面のURLに合わせた、コールバックの URL
  test: 検証用のコールバックの URL（開発とは別にする）
  production: 本番のドメインのコールバックの URL
  when: { answer: auth, in: [oidc, both] }

- name: APP_BASE_URL
  purpose: このアプリ自身の URL（リダイレクト先の組み立てに使う）
  development: 手元の画面のURL
  test: 手元の画面のURL
  production: 本番のドメイン
  when: { answer: auth, in: [oidc, both] }
