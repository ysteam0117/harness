# harness adopt（既存のプロジェクトへの導入、F-29）で、data/template-values.yaml の値の代わりに使う値。
# 同じ名前の値を入れ替える。書き方は template-values.yaml と同じ（名前: 値、または when / value の並び）。
# 条件に合う行がなければ、入れ替えず、template-values.yaml の値を使う。template-values.yaml にない名前は書けない。
#
# 入れ替える理由：導入先のプロジェクトには、harness create が生成するアプリだけにあるもの
# （npm run env:check・check:app・security などのコマンド、docs/project-rules.md・docs/secrets.md・docs/testing/ などの文書、
# テストが開発・本番のDBと分かれていることの保証、技術プロファイルのコード）が無い。当てたプロファイルの Skill は入れる（#18）。
# 無いものを、導入先の文書に書かない。品質チェック・テストのコマンドは「未設定」とし、既存のコマンドを確かめさせる。
# 値の中に、印の文字列（begin・end）を書かない（導入した文書の印と区別できなくなるため）。

