# 実行環境の、検証済みの版と選び方（F-19）。
#
# verified : ハーネスで動作を確かめた版。ハーネス自身の .node-version と同じにする（テストで確かめる）
# policy   : 最新を選ぶときの基準。lts は、長期サポート（LTS）の版の中で最新のもの
node:
  verified: "24.19.0"
  policy: lts

# wrangler.jsonc の compatibility_date（Cloudflare Workers の互換性の日付）。
# テストの道具（@cloudflare/vitest-pool-workers）に同梱された実行エンジンが対応する日付以下にする（新しすぎると起動しない）。
# テストの道具のバージョンを上げるとき（verified_versions の更新）に、対応する日付を確かめて見直す。
# 確かめ方：npm view @cloudflare/vitest-pool-workers@<版> dependencies で miniflare の版を見る。版の中の日付（例：5.20260815.0 → 2026-08-15）が上限。
# 2026-10-03 確認：vitest-pool-workers 0.22.0 → miniflare 5.20260815.0 → 上限 2026-08-15。下の値はこれ以下。
compatibility_date: "2026-08-04"

# 開発用の PostgreSQL のコンテナの版（docker-compose.yml の image の版）。固定する（C-62）。
# 2026-09-30 に、Drizzle ORM の試作（Issue #18）で動作を確かめた版。
postgres_image_tag: "18.6"

# Terraform（IaC、infra/）。ひな形の infra/versions.tf に差し込む。固定する（C-62）。
# terraform_version : 動作を確かめた Terraform の版。infra/versions.tf の required_version の下限と、ハーネスの CI（setup-terraform）の版にする。
# terraform_cloudflare_provider : Cloudflare プロバイダー（cloudflare/cloudflare）の版。v5 系。"= 版" で固定する。
# 確かめ方（Cloudflare には何も作らない。plan・apply・認証は使わない）：
#   生成した infra/ で `terraform init -backend=false -input=false` と `terraform validate` を実行し、成功した版。
#   更新するときも同じ手順で確かめる（D1・R2・Hyperdrive の3つのリソースがすべて入る回答で確かめる）。
# 2026-10-05 確認：Terraform 1.15.5 で、cloudflare/cloudflare 5.26.0 の init・validate が成功した。
terraform_version: "1.15.5"
terraform_cloudflare_provider: "5.26.0"
